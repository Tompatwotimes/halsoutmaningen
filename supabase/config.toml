# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
# This governs the LOCAL stack only. The hosted project is configured
# separately; schema parity is maintained through the migrations in
# ./migrations, which are the source of truth (docs/ARCHITECTURE.md §3, §25).

project_id = "halsoutmaningen"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project's Postgres major version. Verified 2026-09-01 against
# the linked project (ref offvlyflactysibrssco): `show server_version;` => 17.6.
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Private, invite-only product: NO public sign-up. Accounts are created by an
# admin via a privileged Edge Function (inviteUserByEmail). The same setting
# must be applied to the HOSTED project (Dashboard → Authentication → Providers
# → Email, disable "Allow new users to sign up").
enable_signup = false

[auth.email]
enable_signup = false
# Invite emails still require the user to set a password / confirm.
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
# Proof images are private; see docs/ARCHITECTURE.md §18.
file_size_limit = "10MiB"

[analytics]
enabled = false
