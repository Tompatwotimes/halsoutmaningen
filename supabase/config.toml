# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
# This governs the LOCAL stack only. The hosted project is configured
# separately; schema parity is maintained through the migrations in
# ./migrations, which are the source of truth (docs/ARCHITECTURE.md §3, §25).

project_id = "halsoutmaningen"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project's Postgres major version. Verified 2026-09-01 against
# the linked project (ref offvlyflactysibrssco): `show server_version;` => 17.6.
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local email-testing server (formerly [inbucket]). Governs the LOCAL stack
# only — the hosted project sends real invite/reset mail via its own SMTP
# provider and is unaffected by this block.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Private, invite-only product: NO public sign-up. Accounts are created by an
# admin via a privileged Edge Function (inviteUserByEmail). The same setting
# must be applied to the HOSTED project (Dashboard → Authentication → Providers
# → Email, disable "Allow new users to sign up").
enable_signup = false

[auth.email]
enable_signup = false
# Invite emails still require the user to set a password / confirm.
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
# Proof images are private; see docs/ARCHITECTURE.md §18.
file_size_limit = "10MiB"

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------
# Privileged admin operations.
#
# verify_jwt = false on purpose: the function does its OWN, stronger check —
# it validates the caller's JWT with auth.getUser() AND requires the DB
# predicate is_admin() (role='admin' AND active). Leaving the platform's
# generic pre-check off keeps CORS preflight (OPTIONS, no Authorization header)
# working without weakening anything: every real request still passes the
# in-function 401/403 gate.
#
# Secrets required on the hosted project (Dashboard → Edge Functions → Secrets):
#   SITE_URL   — public app origin, e.g. https://app.example.com (for the
#                invite/reset redirect to /aktivera)
# SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY are injected
# automatically by the platform.
[functions.invite-participant]
verify_jwt = false

[analytics]
enabled = false
