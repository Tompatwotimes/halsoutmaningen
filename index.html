<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <script id="theme-init">
      // Resolve and apply the theme BEFORE first paint — no light→dark (or
      // reverse) flash. Deliberately tiny and dependency-free (it runs before
      // any module has loaded); kept in exact sync with the canonical
      // implementation in src/features/theme/theme.ts (tested directly
      // against these same bytes — see theme-init.test.ts) rather than
      // importing it, since an inline script cannot import a module and
      // still block synchronously here.
      //
      // Default is LIGHT for anyone with no stored choice — Hälsoutmaningen's
      // primary identity is light; "system" is an explicit opt-in, never the
      // implicit default.
      (function () {
        try {
          var v = localStorage.getItem('halsoutmaningen-theme');
          var pref =
            v === 'light' || v === 'dark' || v === 'system' ? v : 'light';
          var resolved =
            pref === 'system'
              ? window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref;
          document.documentElement.dataset.theme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              resolved === 'dark' ? '#14181a' : '#faf7f2',
            );
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hälsoutm." />
    <meta
      name="description"
      content="Hälsoutmaningen — daglig träningsutmaning för grupper."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Hälsoutmaningen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
